name: CI

env:
  DEBUG: 'napi:*'
  APP_NAME: 'skia'

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  lint:
    name: Lint SourceCode
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/brooooooklyn/canvas/ubuntu-builder:jammy

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install unzip (required by setup-bun in container)
        run: apt-get update && apt-get install -y unzip

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy, rustfmt

      - name: Install dependencies
        run: bun install --immutable --mode=skip-build

      - name: Download skia binary
        run: |
          git config --global --add safe.directory $(pwd)
          bun ./scripts/release-skia-binary.mjs --download

      - name: 'Lint JS/TS'
        run: bun lint

      - name: Cargo fmt
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy

  build:
    name: stable - x86_64-unknown-linux-gnu - node@24
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: bun install --immutable --mode=skip-build

      - name: Download skia binary
        run: bun ./scripts/release-skia-binary.mjs --download

      - name: Build in docker
        uses: tj-actions/docker-run@v2
        with:
          image: ghcr.io/brooooooklyn/canvas/ubuntu-builder:jammy
          name: build-x86_64-unknown-linux-gnu
          options: --user 0:0 -v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db -v ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache -v ${{ github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index -v ${{ github.workspace }}:/build -w /build
          args: |
            sh -c "(command -v bun || (curl -fsSL https://bun.com/install | bash)) && export PATH=\"$HOME/.bun/bin:$PATH\" && rustup install && rustup target add x86_64-unknown-linux-gnu && bun run build --target x86_64-unknown-linux-gnu"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: ${{ env.APP_NAME }}.*.node

  test-linux-x64-gnu-binding:
    name: Test bindings on Linux-x64-gnu - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download Apple Emoji font
        uses: robinraju/release-downloader@v1
        with:
          repository: 'PoomSmart/EmojiLibrary'
          tag: '0.15.4'
          fileName: AppleColorEmoji@2x.ttf
          token: ${{ secrets.GITHUB_TOKEN }}
          out-file-path: __test__/fonts/

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --immutable --mode=skip-build

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .

      - name: List packages
        run: ls -R .
        shell: bash

      - name: Test bindings
        run: docker run --rm -v $(pwd):/canvas -w /canvas oven/bun:latest bun run test:ci

      - name: Test failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: failure-images-x86_64-unknown-linux-gnu-${{ matrix.node }}
          path: __test__/failure/**

  bench:
    name: Bench
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/brooooooklyn/canvas/ubuntu-builder:jammy

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install unzip (required by setup-bun in container)
        run: apt-get update && apt-get install -y unzip

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: bun install --immutable

      - name: Download skia binary
        run: |
          git config --global --add safe.directory $(pwd)
          bun ./scripts/release-skia-binary.mjs --download

      - name: 'Build'
        run: bun run build

      - name: 'Run benchmark'
        run: bun run bench

  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - test-linux-x64-gnu-binding

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --immutable --mode=skip-build

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Move artifacts
        run: bun run artifacts

      - name: List packages
        run: ls -R ./npm
        shell: bash

      - name: Setup GitHub Packages auth
        run: |
          # `bun publish` lit `.npmrc` pour résoudre l'auth du registry GH Packages.
          # Le scope @aphrody-code est routé vers npm.pkg.github.com, le token vient
          # du GITHUB_TOKEN auto-fourni par Actions (avec permission packages: write).
          cat > .npmrc <<EOF
          @aphrody-code:registry=https://npm.pkg.github.com/
          //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          always-auth=true
          EOF
          # Idem dans chaque sub-package npm/<target>/ pour `napi prepublish`
          for d in npm/*/; do cp .npmrc "$d/.npmrc"; done

      - name: Publish
        run: |
          if git log -1 --pretty=%B | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$";
          then
            bun publish --access public
          else
            echo "Not a release commit, skipping publish"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
